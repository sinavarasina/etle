[package]
name = "etle"
version = "0.1.0"
edition = "2024"

[lib]
name = "etle"
path = "src/lib.rs"

[features]
default = ["cli"]
cli = ["dep:clap"]
gui-relm4 = []

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
blake3 = "1"
chacha20poly1305 = "0.10"
x25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
clap = { version = "4", features = ["derive"], optional = true }
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "p2p-cli"
path = "src/bin/p2p-cli.rs"
required-features = ["cli"]

[[bin]]
name = "p2p-gui"
path = "src/bin/p2p-gui.rs"
required-features = ["gui-relm4"]
