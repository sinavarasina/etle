[package]
name = "etle"
version = "1.0.1"
edition = "2024"

[lib]
name = "etle"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
bincode-next = { version = "3.1.2", features = ["serde"] }
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive"], optional = true }
constant_time_eq = "0.4.2"
get_if_addrs = "0.5.3"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "signal",
    "time",
    "sync",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
zeroize = "1.9.1"
relm4 = { version = "0.11.0", optional = true }
rfd = { version = "0.18.0", optional = true }
hex = "0.4.3"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }

[features]
default = ["cli"]
cli = ["dep:clap"]
gui-relm4 = ["dep:relm4", "dep:rfd"]

[[bin]]
name = "etle-cli"
path = "src/bin/etle-cli.rs"
required-features = ["cli"]

[[bin]]
name = "etle-gui"
path = "src/bin/etle-gui.rs"
required-features = ["gui-relm4"]

[[bin]]
name = "etled"
path = "src/bin/etled.rs"
required-features = ["cli"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[test]]
name = "mitm_test"
path = "tests/mitm_test.rs"

[[test]]
name = "timing_test"
path = "tests/timing_test.rs"

[[test]]
name = "fuzz_simulation_test"
path = "tests/fuzz_simulation_test.rs"

[[bench]]
name = "encrypt_bench"
harness = false

[[bench]]
name = "psk_overhead_bench"
harness = false

[[bench]]
name = "file_write_bench"
harness = false
