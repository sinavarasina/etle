name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build. Leave empty to build the selected branch.
        required: false
        default: ''
        type: string
      publish:
        description: Publish/upload to GitHub Releases. Disable this for dry-run build tests.
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag to publish to, for example v0.1.0. Required only when publish=true from workflow_dispatch.
        required: false
        default: ''
        type: string
      draft:
        description: Create the GitHub Release as draft
        required: false
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub Release as prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-cli:
    name: package CLI/daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-release-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-cli-
            ${{ runner.os }}-cargo-

      - name: Build release CLI binaries
        run: cargo build --locked --release --bins

      - name: Package CLI binaries
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            version="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dryrun-${GITHUB_SHA::7}"
          fi

          host="$(rustc -vV | sed -n 's/^host: //p')"
          asset="etle-${version}-${host}-cli"
          exe=""
          archive="${asset}.tar.gz"

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            exe=".exe"
            archive="${asset}.zip"
          fi

          mkdir -p "dist/${asset}"
          cp "target/release/etle-cli${exe}" "dist/${asset}/"
          cp "target/release/etled${exe}" "dist/${asset}/"

          if [[ -f README.md ]]; then cp README.md "dist/${asset}/"; fi
          if compgen -G "LICENSE*" > /dev/null; then cp LICENSE* "dist/${asset}/"; fi

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${asset}/*' -DestinationPath '${archive}' -Force"
          else
            tar -czf "${archive}" -C dist "${asset}"
          fi

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ runner.os }}
          path: |
            etle-*-cli.tar.gz
            etle-*-cli.zip
          if-no-files-found: error

  build-gui-linux-macos:
    name: package GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}

      - name: Install GTK4 build dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev

      - name: Install GTK4 build dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install gtk4 pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-release-gui-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-gui-
            ${{ runner.os }}-cargo-

      - name: Build release GUI binary
        run: cargo build --locked --release --no-default-features --features gui-relm4 --bin etle-gui

      - name: Package GUI binary
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            version="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dryrun-${GITHUB_SHA::7}"
          fi

          host="$(rustc -vV | sed -n 's/^host: //p')"
          asset="etle-${version}-${host}-gui"
          archive="${asset}.tar.gz"

          mkdir -p "dist/${asset}"
          cp "target/release/etle-gui" "dist/${asset}/"

          cat > "dist/${asset}/GUI-NOTES.md" <<'NOTES'
          # ETLE GUI notes

          This package contains the `etle-gui` binary.

          The GUI is a GTK4 application. On Linux/macOS, install a compatible GTK4
          runtime with your package manager when needed.
          NOTES

          if [[ -f README.md ]]; then cp README.md "dist/${asset}/"; fi
          if compgen -G "LICENSE*" > /dev/null; then cp LICENSE* "dist/${asset}/"; fi

          tar -czf "${archive}" -C dist "${asset}"

      - name: Upload packaged GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-gui-${{ runner.os }}
          path: etle-*-gui.tar.gz
          if-no-files-found: error

  build-gui-windows:
    name: package GUI (Windows UCRT64 bundled)
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}

      - name: Install MSYS2 Rust, GTK4, and packaging tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            zip

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: Windows-cargo-release-gui-ucrt64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            Windows-cargo-release-gui-ucrt64-
            Windows-cargo-

      - name: Build release GUI binary
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig
        run: |
          set -euo pipefail

          export PATH="/ucrt64/bin:${PATH}"

          which cargo
          cargo --version
          rustc -vV
          which pkg-config
          pkg-config --modversion gtk4

          cargo build \
            --locked \
            --release \
            --no-default-features \
            --features gui-relm4 \
            --bin etle-gui

      - name: Package Windows GUI with GTK DLL runtime
        run: |
          set -euo pipefail

          export PATH="/ucrt64/bin:${PATH}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            version="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dryrun-${GITHUB_SHA::7}"
          fi

          host="$(rustc -vV | sed -n 's/^host: //p')"
          asset="etle-${version}-${host}-gui"
          exe_path="target/release/etle-gui.exe"

          mkdir -p "dist/${asset}"
          cp "${exe_path}" "dist/${asset}/"

          ldd "${exe_path}" \
            | awk '
                {
                  for (i = 1; i <= NF; i++) {
                    if ($i ~ /^\/ucrt64\/bin\/.*\.dll$/) {
                      print $i
                    }
                  }
                }
              ' \
            | sort -u \
            | while read -r dll; do
                cp -v "${dll}" "dist/${asset}/"
              done

          mkdir -p "dist/${asset}/share/glib-2.0" "dist/${asset}/share/icons" "dist/${asset}/share" "dist/${asset}/lib" "dist/${asset}/etc"

          cp -a /ucrt64/share/glib-2.0/schemas "dist/${asset}/share/glib-2.0/" || true
          cp -a /ucrt64/share/icons/Adwaita "dist/${asset}/share/icons/" || true
          cp -a /ucrt64/share/icons/hicolor "dist/${asset}/share/icons/" || true
          cp -a /ucrt64/share/fontconfig "dist/${asset}/share/" || true
          cp -a /ucrt64/lib/gdk-pixbuf-2.0 "dist/${asset}/lib/" || true
          cp -a /ucrt64/lib/gtk-4.0 "dist/${asset}/lib/" || true
          cp -a /ucrt64/etc/fonts "dist/${asset}/etc/" || true

          cat > "dist/${asset}/GUI-WINDOWS-NOTES.md" <<'NOTES'
          # ETLE GUI for Windows

          This package bundles `etle-gui.exe` with the MSYS2 UCRT64 GTK4 runtime
          DLLs and common GTK runtime data directories.

          Run:
              etle-gui.exe

          Notes:
          - Keep the DLL files and the `share/`, `lib/`, and `etc/` directories
            next to `etle-gui.exe`.
          - This is a portable zip package, not an installer.
          - If antivirus/quarantine removes DLLs, extract again.
          NOTES

          if [[ -f README.md ]]; then cp README.md "dist/${asset}/"; fi
          if compgen -G "LICENSE*" > /dev/null; then cp LICENSE* "dist/${asset}/"; fi

          (cd dist && zip -r "../${asset}.zip" "${asset}")

      - name: Upload packaged Windows GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-gui-Windows
          path: etle-*-windows*-gui.zip
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    if: github.event_name == 'push' || inputs.publish
    needs:
      - build-cli
      - build-gui-linux-macos
      - build-gui-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate release tag input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.release_tag }}" ]]; then
            echo "release_tag is required when publish=true from workflow_dispatch" >&2
            exit 1
          fi

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(dist/*.tar.gz dist/*.zip)
          if (( ${#assets[@]} == 0 )); then
            echo "no release assets found" >&2
            exit 1
          fi

          args=(--generate-notes --title "${RELEASE_TAG}")
          if [[ "${RELEASE_DRAFT}" == "true" ]]; then args+=(--draft); fi
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then args+=(--prerelease); fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" "${args[@]}"
          fi
