name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build. Leave empty to build the selected branch.
        required: false
        default: ''
        type: string
      publish:
        description: Publish/upload to GitHub Releases. Disable this for dry-run build tests.
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag, for example v0.1.0. Required when publish=true from workflow_dispatch.
        required: false
        default: ''
        type: string
      draft:
        description: Create the GitHub Release as draft.
        required: false
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub Release as prerelease.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  package-unix:
    name: package portable bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install GTK4 build dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev

      - name: Install GTK4 build dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install gtk4 pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            version="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dryrun-${GITHUB_SHA::7}"
          fi

          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ && ! "${version}" =~ ^dryrun-[0-9a-f]{7}$ ]]; then
            echo "invalid release version: ${version}" >&2
            echo "expected tag format: vMAJOR.MINOR.PATCH, for example v0.1.0" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-release-portable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-portable-
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        env:
          ETLE_RELEASE_TAG: ${{ steps.meta.outputs.version }}
          ETLE_BUILD_DATE: ${{ steps.meta.outputs.build_date }}
        run: |
          cargo build --locked --release --bin etle-cli --bin etled
          cargo build --locked --release --no-default-features --features gui-relm4 --bin etle-gui

      - name: Package portable bundle
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.meta.outputs.version }}"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          asset="etle-${version}-${host}-portable"
          archive="${asset}.tar.gz"

          mkdir -p "dist/${asset}"

          cp "target/release/etle-cli" "dist/${asset}/"
          cp "target/release/etled" "dist/${asset}/"
          cp "target/release/etle-gui" "dist/${asset}/"

          {
            echo "# ETLE ${version}"
            echo
            echo "Portable bundle for ${host}."
            echo
            echo "Included binaries:"
            echo "- etle-cli"
            echo "- etled"
            echo "- etle-gui"
            echo
            echo "Usage:"
            echo "    ./etled -v serve"
            echo "    ./etle-cli --help"
            echo "    ./etle-cli --version"
            echo "    ./etled --version"
            echo "    ./etle-gui --version"
            echo "    ./etle-gui"
            echo
            echo "Linux/macOS runtime notes:"
            echo "- etle-cli and etled are CLI/daemon binaries."
            echo "- etle-gui is a GTK4 application."
            echo "- Install GTK4 runtime using the system package manager when needed."
            echo
            echo "Build:"
            echo "- Version: ${version}"
            echo "- Host: ${host}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Built at: ${{ steps.meta.outputs.build_date }}"
          } > "dist/${asset}/PACKAGE-NOTES.md"

          {
            echo "===== etle-cli ====="
            "target/release/etle-cli" --version
            echo
            echo "===== etled ====="
            "target/release/etled" --version
            echo
            echo "===== etle-gui ====="
            "target/release/etle-gui" --version
          } > "dist/${asset}/BUILD-INFO.txt"

          (
            cd "dist/${asset}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum etle-cli etled etle-gui > SHA256SUMS.txt
            else
              shasum -a 256 etle-cli etled etle-gui > SHA256SUMS.txt
            fi
          )

          if [[ -f README.md ]]; then cp README.md "dist/${asset}/"; fi
          if compgen -G "LICENSE*" > /dev/null; then cp LICENSE* "dist/${asset}/"; fi

          tar -czf "${archive}" -C dist "${asset}"

      - name: Upload portable bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-portable-${{ runner.os }}
          path: etle-*-portable.tar.gz
          if-no-files-found: error

  package-windows:
    name: package portable bundle (Windows UCRT64 bundled)
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install MSYS2 Rust, GTK4, and packaging tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            zip

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            version="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dryrun-${GITHUB_SHA::7}"
          fi

          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ && ! "${version}" =~ ^dryrun-[0-9a-f]{7}$ ]]; then
            echo "invalid release version: ${version}" >&2
            echo "expected tag format: vMAJOR.MINOR.PATCH, for example v0.1.0" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: Windows-cargo-release-portable-ucrt64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            Windows-cargo-release-portable-ucrt64-
            Windows-cargo-

      - name: Build release binaries
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig
          ETLE_RELEASE_TAG: ${{ steps.meta.outputs.version }}
          ETLE_BUILD_DATE: ${{ steps.meta.outputs.build_date }}
        run: |
          set -euo pipefail

          export PATH="/ucrt64/bin:${PATH}"

          which cargo
          cargo --version
          rustc -vV
          which pkg-config
          pkg-config --modversion gtk4

          cargo build --locked --release --bin etle-cli --bin etled
          cargo build --locked --release --no-default-features --features gui-relm4 --bin etle-gui

      - name: Package Windows portable bundle with GTK runtime
        run: |
          set -euo pipefail

          export PATH="/ucrt64/bin:${PATH}"

          version="${{ steps.meta.outputs.version }}"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          asset="etle-${version}-${host}-portable"

          mkdir -p "dist/${asset}"

          cp "target/release/etle-cli.exe" "dist/${asset}/"
          cp "target/release/etled.exe" "dist/${asset}/"
          cp "target/release/etle-gui.exe" "dist/${asset}/"

          {
            ldd "target/release/etle-cli.exe" || true
            ldd "target/release/etled.exe" || true
            ldd "target/release/etle-gui.exe" || true
          } \
            | awk '
                {
                  for (i = 1; i <= NF; i++) {
                    if ($i ~ /^\/ucrt64\/bin\/.*\.dll$/) {
                      print $i
                    }
                  }
                }
              ' \
            | sort -u \
            | while read -r dll; do
                cp -v "${dll}" "dist/${asset}/"
              done

          cp -v /ucrt64/bin/gspawn-*.exe "dist/${asset}/" || true

          mkdir -p \
            "dist/${asset}/share/glib-2.0" \
            "dist/${asset}/share/icons" \
            "dist/${asset}/share" \
            "dist/${asset}/lib" \
            "dist/${asset}/etc"

          cp -a /ucrt64/share/glib-2.0/schemas "dist/${asset}/share/glib-2.0/" || true
          cp -a /ucrt64/share/icons/Adwaita "dist/${asset}/share/icons/" || true
          cp -a /ucrt64/share/icons/hicolor "dist/${asset}/share/icons/" || true
          cp -a /ucrt64/share/fontconfig "dist/${asset}/share/" || true
          cp -a /ucrt64/lib/gdk-pixbuf-2.0 "dist/${asset}/lib/" || true
          cp -a /ucrt64/lib/gtk-4.0 "dist/${asset}/lib/" || true
          cp -a /ucrt64/etc/fonts "dist/${asset}/etc/" || true

          {
            echo "# ETLE ${version}"
            echo
            echo "Portable bundle for ${host}."
            echo
            echo "Included binaries:"
            echo "- etle-cli.exe"
            echo "- etled.exe"
            echo "- etle-gui.exe"
            echo
            echo "Usage:"
            echo "    etled.exe -v serve"
            echo "    etle-cli.exe --help"
            echo "    etle-cli.exe --version"
            echo "    etled.exe --version"
            echo "    etle-gui.exe --version"
            echo "    etle-gui.exe"
            echo
            echo "Windows runtime notes:"
            echo "- GTK4 runtime DLLs and common GTK data directories are bundled."
            echo "- Keep the EXE files, DLL files, share/, lib/, and etc/ together."
            echo "- This is a portable zip package, not an installer."
            echo "- If antivirus/quarantine removes DLLs, extract the zip again."
            echo
            echo "Build:"
            echo "- Version: ${version}"
            echo "- Host: ${host}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Built at: ${{ steps.meta.outputs.build_date }}"
          } > "dist/${asset}/PACKAGE-NOTES.md"

          {
            echo "===== etle-cli ====="
            "./target/release/etle-cli.exe" --version
            echo
            echo "===== etled ====="
            "./target/release/etled.exe" --version
            echo
            echo "===== etle-gui ====="
            "./target/release/etle-gui.exe" --version
          } > "dist/${asset}/BUILD-INFO.txt"

          (
            cd "dist/${asset}"
            sha256sum etle-cli.exe etled.exe etle-gui.exe > SHA256SUMS.txt
          )

          if [[ -f README.md ]]; then cp README.md "dist/${asset}/"; fi
          if compgen -G "LICENSE*" > /dev/null; then cp LICENSE* "dist/${asset}/"; fi

          (cd dist && zip -r "../${asset}.zip" "${asset}")

      - name: Upload Windows portable bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-portable-Windows
          path: etle-*-portable.zip
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    if: github.event_name == 'push' || inputs.publish
    needs:
      - package-unix
      - package-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate release tag input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ inputs.release_tag }}" ]]; then
            echo "release_tag is required when publish=true from workflow_dispatch" >&2
            exit 1
          fi

          if [[ ! "${{ inputs.release_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release_tag: ${{ inputs.release_tag }}" >&2
            echo "expected format: vMAJOR.MINOR.PATCH, for example v0.1.0" >&2
            exit 1
          fi

      - name: Checkout repository for tag verification
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate archive checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          cd dist
          assets=(*.tar.gz *.zip)

          if (( ${#assets[@]} == 0 )); then
            echo "no archives found for checksum generation" >&2
            exit 1
          fi

          sha256sum "${assets[@]}" > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(dist/*.tar.gz dist/*.zip dist/CHECKSUMS.txt)

          if (( ${#assets[@]} == 0 )); then
            echo "no release assets found" >&2
            exit 1
          fi

          args=(--verify-tag --generate-notes --title "ETLE ${RELEASE_TAG}")
          if [[ "${RELEASE_DRAFT}" == "true" ]]; then args+=(--draft); fi
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then args+=(--prerelease); fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" "${args[@]}"
          fi
