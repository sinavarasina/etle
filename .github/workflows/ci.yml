name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (all features, linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GTK4 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-

      - name: Run clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  feature-checks:
    name: feature checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GTK4 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-
            ${{ runner.os }}-cargo-

      - name: Check library without default features
        run: cargo check --locked --lib --no-default-features

      - name: Check default CLI targets
        run: cargo check --locked --all-targets

      - name: Check GUI-only binary
        run: cargo check --locked --no-default-features --features gui-relm4 --bin etle-gui

      - name: Check all targets and features
        run: cargo check --locked --all-targets --all-features

  test-core:
    name: core test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Check default targets
        run: cargo check --locked --all-targets

      - name: Run default tests
        run: cargo test --locked --all-targets

      - name: Build release CLI and daemon binaries
        run: cargo build --locked --release --bin etle-cli --bin etled

      - name: Check release CLI and daemon build info
        shell: bash
        run: |
          set -euo pipefail

          exe=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            exe=".exe"
          fi

          "target/release/etle-cli${exe}" --version
          "target/release/etled${exe}" --version

  gui-linux:
    name: GUI build/test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GTK4 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gui-
            ${{ runner.os }}-cargo-

      - name: Check GUI-only binary
        run: cargo check --locked --no-default-features --features gui-relm4 --bin etle-gui

      - name: Clippy GUI-only binary
        run: cargo clippy --locked --no-default-features --features gui-relm4 --bin etle-gui -- -D warnings

      - name: Build GUI release binary
        run: cargo build --locked --release --no-default-features --features gui-relm4 --bin etle-gui

      - name: Check GUI build info
        run: target/release/etle-gui --version

  gui-macos:
    name: GUI build/test (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GTK4 build dependencies
        run: brew install gtk4 pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and git sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gui-
            ${{ runner.os }}-cargo-

      - name: Check GUI-only binary
        run: cargo check --locked --no-default-features --features gui-relm4 --bin etle-gui

      - name: Build GUI release binary
        run: cargo build --locked --release --no-default-features --features gui-relm4 --bin etle-gui

      - name: Check GUI build info
        run: target/release/etle-gui --version

  gui-windows:
    name: GUI build/test (windows/msys2)
    runs-on: windows-latest
    timeout-minutes: 50

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up MSYS2 GTK4 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4

      - name: Check GUI-only binary
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:${PATH}"
          cargo check --locked --no-default-features --features gui-relm4 --bin etle-gui

      - name: Build GUI release binary
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:${PATH}"
          cargo build --locked --release --no-default-features --features gui-relm4 --bin etle-gui

      - name: Check GUI build info
        run: target/release/etle-gui.exe --version

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - feature-checks
      - test-core
      - gui-linux
      - gui-macos
      - gui-windows
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.clippy.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.feature-checks.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.test-core.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.gui-linux.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.gui-macos.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.gui-windows.result }}" != "success" ]]; then exit 1; fi
